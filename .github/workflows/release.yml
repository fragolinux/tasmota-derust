# Release: runs only when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# It can also be started by hand (Actions > Release > Run workflow) as a dry run: everything
# is built and scanned, nothing is published.
#
#   check -> build (macOS, Linux + Windows, Android) -> Trivy scan of the archives -> release
#
# The scan runs on the finished archives, before anything is published: a fixable HIGH or
# CRITICAL vulnerability stops the release. Its summary goes into the release notes, and
# the full reports plus CycloneDX SBOMs are attached as security-reports.zip.
#
# Needed repository secrets (see DEVELOPMENT.md, "Releases and CI"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  ZIG_VERSION: "0.17.1"
  ZIG_SHA256: "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"
  NDK_VERSION: "30.0.16248370"

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($v)."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tools
        run: cargo install --locked cargo-auditable
      - name: Build
        run: make mac package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
          if-no-files-found: error

  linux-windows:
    name: Build Linux and Windows
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-gnu
      - name: mingw-w64 and zig
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64
          f="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/$f"
          echo "${ZIG_SHA256}  $f" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf "$f" -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tools
        run: cargo install --locked cargo-auditable cargo-zigbuild
      - name: Build
        run: make linux windows
      - name: Smoke test (Linux web server)
        run: |
          DERUST_MQTT_HOST=127.0.0.1 DERUST_MQTT_PORT=1 \
            dist/linux/tasmota-derust-web --listen 127.0.0.1:8099 --read-only &
          pid=$!
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8099/api/state > state.json && break; sleep 0.5; done
          grep -q '"read_only":true' state.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/api/devices/x/power/1)" = 403
          kill "$pid"
      - name: Package
        run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-windows
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
          if-no-files-found: error

  android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tools
        run: |
          cargo install --locked cargo-auditable cargo-ndk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/tasmota-derust-release.jks
          elif [ "$GITHUB_REF_TYPE" != tag ]; then
            # Dry run without the secrets: a throwaway key, so the rest can still be tried.
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key (dry run only)."
            keytool -genkeypair -keystore ~/.android/tasmota-derust-release.jks -alias tasmota-derust \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Dry run" \
              -storepass dry-run-only -keypass dry-run-only
            echo "DERUST_KEYSTORE_PASSWORD=dry-run-only" >> "$GITHUB_ENV"
          else
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing: create the key with 'make release-key' and add it (DEVELOPMENT.md, Releases and CI)."
            exit 1
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export DERUST_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-$DERUST_KEYSTORE_PASSWORD}"
          make apk package
      - name: Remove the signing key
        if: always()
        run: rm -f ~/.android/tasmota-derust-release.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/release/*.apk
          if-no-files-found: error

  scan:
    name: Trivy scan of the archives
    needs: [macos, linux-windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Install Trivy
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          sudo tar -xzf "$f" -C /usr/local/bin trivy
      - name: Scan
        run: bash scripts/scan-artifacts.sh dist/release dist/security
      - name: Summary
        if: always()
        run: cat dist/security/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Bundle the reports
        if: always()
        run: |
          cp dist/security/SUMMARY.md dist/ || true
          cd dist/security && zip -q ../security-reports.zip -- * || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security
          path: |
            dist/security-reports.zip
            dist/SUMMARY.md
          if-no-files-found: ignore

  release:
    name: Publish the release
    needs: [check, scan]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security
          path: security
      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cd ..
          cat > notes.md <<EOF
          ## Downloads

          | | Desktop app | Web server |
          |---|---|---|
          | macOS (Apple Silicon) | \`tasmota-derust-${VERSION}-macos-arm64.zip\` | \`tasmota-derust-web-${VERSION}-macos-arm64.tar.gz\` |
          | Windows x64 | \`tasmota-derust-${VERSION}-windows-x64.zip\` | \`tasmota-derust-web-${VERSION}-windows-x64.zip\` |
          | Linux x64 | \`tasmota-derust-${VERSION}-linux-x64.tar.gz\` | \`tasmota-derust-web-${VERSION}-linux-x64.tar.gz\` |
          | Android 13+ | \`tasmota-derust-${VERSION}.apk\` | |

          The apps are not notarized: on macOS open the app with right-click > Open the first
          time; on Windows choose "More info > Run anyway" if SmartScreen asks.
          Checksums: \`SHA256SUMS\`.

          EOF
          cat security/SUMMARY.md >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Tasmota Derust $VERSION" --notes-file notes.md --generate-notes \
            release/* security/security-reports.zip
