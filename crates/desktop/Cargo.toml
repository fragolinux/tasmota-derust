[package]
name = "tasmota-derust"
description = "A modern manager for Tasmota devices (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dependencies]
tasmota-derust-core.workspace = true
tasmota-derust-web.workspace = true
chrono = "0.4.45"
crossbeam-channel.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.37.0"
egui_extras = "0.37.0"
env_logger = "0.11.11"
open = "5.4.5"
serde_json.workspace = true
png = "0.18.1"

[features]
# Development only: DERUST_SCREENSHOTS=<dir> saves a PNG of each screen (README images).
screenshots = []
